name: random_menu
description: 随机菜单，记录做过的菜和去过的餐厅。
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.0
dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  file_picker: ^11.0.3
  archive: ^4.0.9
  uuid: ^4.5.3
  share_plus: 12.0.2
  exif: 3.3.0
  cross_file: ^0.3.5+5
  flutter_staggered_grid_view: ^0.7.0
  geolocator: ^14.0.2
  sqflite: ^2.4.2+1
  flutter_image_compress: ^2.5.1
  flutter_pickers: ^2.2.0
  lpinyin: ^2.0.3
  scrollable_positioned_list: ^0.3.8
dev_dependencies:
  flutter_lints: ^6.0.0
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/branding/logo.png
